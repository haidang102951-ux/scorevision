<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự Đoán Chi Tiết | Score Vision</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
        body{background:#05050a;color:#f8fafc;line-height:1.8;padding:16px;max-width:768px;margin:0 auto;}
        .menu{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px;}
        .menu-btn{background:#0f172a;color:#cbd5e1;padding:10px 14px;border-radius:10px;text-align:center;text-decoration:none;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:5px;border:1px solid #1e293b;transition:all .2s;}
        .menu-btn:hover{transform:translateY(-2px);border-color:#334155;}
        .menu-btn.active{background:linear-gradient(135deg,#22c55e 0%,#16a34a 100%);color:white;border-color:#22c55e;box-shadow:0 4px 12px rgba(34,197,94,.25);}
        .page-title{font-size:24px;font-weight:800;margin:20px 0 30px;text-align:center;color:#fef08a;}
        .card{background:linear-gradient(145deg,#1e293b,#0f172a);border-radius:20px;padding:20px;margin-bottom:16px;border:2px solid #334155;}
        .card:hover{border-color:#fef08a;}
        .card-teams{font-size:18px;font-weight:800;text-align:center;margin-bottom:10px;color:#fef08a;}
        .card-time{text-align:center;color:#94a3b8;margin-bottom:12px;}
        .section{margin-bottom:10px;padding-left:10px;border-left:3px solid #22c55e;}
        .section h3{font-size:14px;color:#86efac;margin-bottom:4px;}
        .section p{color:#e2e8f0;font-size:14px;}
        .kq{background:rgba(34,197,94,.1);border-radius:10px;padding:12px;margin-top:12px;border:1px solid #22c55e;}
        .kq h3{color:#86efac;font-size:15px;margin-bottom:6px;}
        .kq p{font-weight:700;color:#fef08a;}
        .empty{text-align:center;color:#64748b;padding:50px 20px;}
    </style>
</head>
<body>
<nav class="menu">
    <a href="index.html" class="menu-btn">🏠 Trang chủ</a>
    <a href="lich-dau.html" class="menu-btn">📅 Lịch đấu</a>
    <a href="du-doan.html" class="menu-btn active">🔮 Dự đoán</a>
    <a href="bang-xep-hang.html" class="menu-btn">📊 Bảng xếp hạng</a>
    <a href="thong-ke.html" class="menu-btn">📈 Thống kê</a>
    <a href="tin-nong.html" class="menu-btn">📰 Tin Nóng</a>
</nav>

<h1 class="page-title">🔮 Dự Đoán Chi Tiết</h1>
<div id="list"><div class="empty">Đang tải dữ liệu...</div></div>

<script>
const GID_DU_DOAN = "0";
const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQwrXKqXdfjGK7EQCkNwjuv-FbFJxHhQyCg1NxBl2kkMnGuPCYL1vnG6QFBujGwNCVlx5v1keQuviBV/pub?output=csv&gid="+GID_DU_DOAN;

function parseCSV(text){
    const rows=[], lines=text.split("\n");
    for(let l of lines){
        if(!l.trim())continue;
        let p=[],c="",q=0;
        for(let ch of l){
            if(ch=='"')q=!q;
            else if(ch==','&&!q){p.push(c.trim());c="";}
            else c+=ch;
        }
        p.push(c.trim());rows.push(p);
    }
    return rows;
}

fetch(URL).then(r=>r.text()).then(csv=>{
    const rows=parseCSV(csv), data=[];
    for(let i=1;i<rows.length;i++){
        const [loai,thutu,ten,ngaygio,phantich,phongdo,dudoan,tyso]=rows[i];
        if(loai!=="du_doan")continue;
        data.push({st:Number(thutu)||999,ten,ngaygio,phantich,phongdo,dudoan,tyso});
    }
    data.sort((a,b)=>a.st-b.st);
    const box=document.getElementById("list");
    if(!data.length){box.innerHTML=`<div class="empty">Chưa có dữ liệu<br>Điền vào Sheet "Dự Đoán" → tự hiện!</div>`;return;}
    box.innerHTML="";
    data.forEach(x=>{
        let html=`<div class="card"><div class="card-teams">${x.ten}</div><div class="card-time">📅 ${x.ngaygio}</div>`;
        if(x.phantich)html+=`<div class="section"><h3>📝 Phân tích</h3><p>${x.phantich}</p></div>`;
        if(x.phongdo)html+=`<div class="section"><h3>📊 Phong độ</h3><p>${x.phongdo}</p></div>`;
        if(x.dudoan||x.tyso){
            html+=`<div class="kq">`;
            if(x.dudoan)html+=`<h3>✅ DỰ ĐOÁN</h3><p>${x.dudoan}</p>`;
            if(x.tyso)html+=`<h3>📈 TỶ SỐ / TÀI XỈU</h3><p>${x.tyso}</p>`;
            html+=`</div>`;
        }
        html+=`</div>`;
        box.innerHTML+=html;
    });
}).catch(()=>{document.getElementById("list").innerHTML=`<div class="empty" style="color:#f87171;">⚠️ Kiểm tra Sheet đã Xuất bản & Chia sẻ công khai chưa!</div>`;});
</script>
</body>
</html>
