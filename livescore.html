<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ LiveScore — Tỉ Số & Chi Tiết | Score Vision</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
        :root{--bg-main:#030712; --text-primary:#f1f5f9; --accent-green:#22c55e; --border-subtle:rgba(148,163,184,.15);}
        body{background:radial-gradient(circle at 20% 0%, rgba(30,64,175,.08) 0%, transparent 50%),radial-gradient(circle at 80% 10%, rgba(34,197,94,.05) 0%, transparent 45%),linear-gradient(180deg,#030712 0%,#0f172a 50%,#030712 100%);color:var(--text-primary);line-height:1.7;min-height:100vh;}
        .container{max-width:1100px;margin:0 auto;padding:0 16px;}
        .dau-trang{text-align:center;padding:30px 10px 10px;}
        .dau-trang h1{font-size:26px;color:#22c55e;}
        .dau-trang p{color:#94a3b8;font-size:14px;}
        .menu{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0;padding:10px 14px;background:rgba(15,23,42,.65);border-radius:14px;border:1px solid var(--border-subtle);position:sticky;top:8px;z-index:99;}
        .menu a{color:#cbd5e1;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:13px;}
        .menu a:hover,.menu a.active{background:rgba(34,197,94,.12);color:#86efac;}
        .tab-menu{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;}
        .tab-btn{padding:8px 14px;background:rgba(30,41,59,.8);border:none;border-radius:8px 8px 0 0;color:#94a3b8;cursor:pointer;font-size:13px;}
        .tab-btn.active{background:rgba(34,197,94,.15);color:#22c55e;font-weight:600;}
        .khoi{background:linear-gradient(145deg,rgba(30,41,59,.85),rgba(15,23,42,.9));border-radius:16px;padding:24px;border:1px solid rgba(34,197,94,.15);margin-bottom:24px;}
        .khoi h2{font-size:16px;color:#94a3b8;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(59,130,246,.15);}
        .tab-content{display:none;}
        .tab-content.active{display:block;}
        iframe{width:100%;border-radius:10px;border:none;}
        .chan-trang{margin-top:10px;text-align:center;padding:10px 0;border-top:1px solid var(--border-subtle);font-size:12px;color:#64748b;}
    </style>
</head>
<body>
<div class="container">
    <div class="dau-trang">
        <h1>⚽ TỈ SỐ & CHI TIẾT TRẬN</h1>
        <p>Nguồn: GoalAPI — Cập nhật tự động mỗi 60 giây</p>
    </div>

<nav class="menu">
    <a href="index.html">🏠 Trang chủ</a>
    <a href="lich-dau.html">📅 Lịch đấu</a>
    <a href="du-doan.html">🔮 Phân Tích & Dự Đoán</a>
    <a href="bang-xep-hang.html">📊 Bảng xếp hạng</a>
    <a href="thong-ke.html">📈 Thống kê</a>
    <a href="tin-nong.html">📰 Tin Nóng</a>
    <a href="ket-qua.html">🏆 Kết Quả</a>
    <a href="livescore.html" class="active">⚽ LiveScore</a>
    <a href="gop-y.html">💬 Góp Ý</a>
</nav>

    <!-- KHỐI 1: DANH SÁCH TỈ SỐ -->
    <div class="khoi">
        <div class="tab-menu">
            <button class="tab-btn active" onclick="chuyenTab('tructiep')">🔴 Trực Tiếp</button>
            <button class="tab-btn" onclick="chuyenTab('lich')">📅 Lịch Sắp Đấu</button>
            <button class="tab-btn" onclick="chuyenTab('ketqua')">✅ Kết Quả</button>
        </div>
        <div id="tab-tructiep" class="tab-content active">
            <iframe src="https://goalapi.net/nhung/livescore?theme=dark&lang=vi&accent=3b3b3f" 
            width="100%" height="600" frameborder="0" loading="lazy" scrolling="auto" 
            title="Trực Tiếp"></iframe>
        </div>
        <div id="tab-lich" class="tab-content">
            <iframe src="https://goalapi.net/nhung/lich-thi-dau?theme=dark&lang=vi&accent=3b3b3f" 
            width="100%" height="600" frameborder="0" loading="lazy" scrolling="auto" 
            title="Lịch Thi Đấu"></iframe>
        </div>
        <div id="tab-ketqua" class="tab-content">
            <iframe src="https://goalapi.net/nhung/ket-qua?theme=dark&lang=vi&accent=3b3b3f" 
            width="100%" height="600" frameborder="0" loading="lazy" scrolling="auto" 
            title="Kết Quả"></iframe>
        </div>
    </div>

    <!-- KHỐI 2: CHI TIẾT TRẬN → TĂNG CHIỀU CAO = 800px ĐỂ HIỆN HẾT -->
    <div class="khoi">
        <h2>📋 CHI TIẾT TRẬN ĐẤU</h2>
        <!-- ✅ ĐÃ TĂNG CHIỀU CAO LÊN 800px → HIỆN HẾT DỄN BIẾN + THỐNG KÊ -->
        <iframe src="https://goalapi.net/nhung/chi-tiet-tran?theme=dark&lang=vi&id=100050926" 
        id="goalapi-match" width="100%" height="800" frameborder="0" loading="lazy" scrolling="auto" 
        style="border:0; border-radius:8px; overflow:hidden;" title="Chi Tiết Trận Đấu"></iframe>
    </div>

<div class="chan-trang">
    <p>🔄 Tự cập nhật mỗi 60 giây | ✅ Nguồn: GoalAPI — Không cần API Key</p>
</div>
</div>

<script>
function chuyenTab(tenTab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('tab-' + tenTab).classList.add('active');
}
</script>
</body>
</html>
