        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
        :root{--bg-main:#030712; --text-primary:#f1f5f9; --accent-green:#22c55e; --accent-gold:#fef08a; --border-subtle:rgba(148,163,184,.15);}
        body{background:radial-gradient(circle at 20% 0%, rgba(30,64,175,.08) 0%, transparent 50%),radial-gradient(circle at 80% 10%, rgba(34,197,94,.05) 0%, transparent 45%),linear-gradient(180deg,#030712 0%,#0f172a 50%,#030712 100%);color:var(--text-primary);line-height:1.7;min-height:100vh;}
        .container{max-width:1100px;margin:0 auto;padding:0 16px;}
        .dau-trang{text-align:center;padding:30px 10px 10px;}
        .dau-trang h1{font-size:26px;color:#22c55e;}
        .dau-trang p{color:#94a3b8;font-size:14px;}
        .menu{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0;padding:10px 14px;background:rgba(15,23,42,.65);border-radius:14px;border:1px solid var(--border-subtle);position:sticky;top:8px;z-index:99;}
        .menu a{color:#cbd5e1;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:13px;}
        .menu a:hover,.menu a.active{background:rgba(34,197,94,.12);color:#86efac;}
        .tab-menu{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;}
        .tab-btn{padding:8px 14px;background:rgba(30,41,59,.8);border:none;border-radius:8px 8px 0 0;color:#94a3b8;cursor:pointer;font-size:13px;}
        .tab-btn.active{background:rgba(34,197,94,.15);color:#22c55e;font-weight:600;}
        .tab-giai{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0;}
        .tab-giai-btn{padding:7px 12px;background:rgba(30,41,59,.6);border:none;border-radius:8px;color:#94a3b8;cursor:pointer;font-size:12px;transition:all .2s;}
        .tab-giai-btn:hover{background:rgba(59,130,246,.15);color:#93c5fd;}
        .tab-giai-btn.active{background:rgba(59,130,246,.20);color:#bfdbfe;font-weight:600;}
        .khoi-chinh{background:linear-gradient(145deg,rgba(30,41,59,.85),rgba(15,23,42,.9));border-radius:16px;padding:24px;border:1px solid rgba(34,197,94,.15);margin-bottom:24px;}
        .tab-content{display:none;}
        .tab-content.active{display:block;}
        iframe{width:100%;border-radius:10px;border:none;}
        .khung-giai-lon{min-height:480px;background:rgba(15,23,42,.5);border-radius:10px;padding:16px;border:1px solid rgba(59,130,246,.15);}
        .trang-thai{font-size:13px;color:#94a3b8;margin-bottom:10px;}
        .khung-highlight{text-align:center;padding:15px 5px;}
        .khung-highlight h3{color:#fef08a;margin-bottom:10px;font-size:16px;}
        .khung-highlight p{color:#94a3b8;margin-bottom:14px;font-size:13px;}
        .video-iframe{width:100%;height:340px;border-radius:8px;overflow:hidden;}
        .tatca-giai-lon > div{margin-bottom:16px;}
        .chan-trang{margin-top:10px;text-align:center;padding:10px 0;border-top:1px solid var(--border-subtle);font-size:12px;color:#64748b;}
    </style>
</head>

<div class="chan-trang">

<script>
// ==================================================
// ✅ ĐÃ THÊM: VÔ ĐỊCH AFC CHÂU Á
// ==================================================
const MA_NHUNG = {
    tatca: `
<div class="tatca-giai-lon">
  <div><h4 style="color:#fef08a;margin:4px 0 8px 0;">🏴 Ngoại Hạng Anh</h4>
  <iframe src="https://footballdata.io/widget/livescore?league=15&theme=dark&accent=2d2a2a&refresh=60" style="width:100%;max-width:100%;height:470px;border:0;border-radius:12px" loading="lazy" title="Ngoại Hạng Anh"></iframe></div>

  <div><h4 style="color:#fef08a;margin:16px 0 8px 0;">🏆 Cúp C1 Châu Âu</h4>
  <iframe src="https://footballdata.io/widget/livescore?league=45&theme=dark&accent=2d2a2a&refresh=60" style="width:100%;max-width:100%;height:470px;border:0;border-radius:12px" loading="lazy" title="Cúp C1"></iframe></div>

  <div><h4 style="color:#fef08a;margin:16px 0 8px 0;">🇪🇸 La Liga</h4>
  <iframe src="https://footballdata.io/widget/livescore?league=10&theme=dark&accent=2d2a2a&refresh=60" style="width:100%;max-width:100%;height:470px;border:0;border-radius:12px" loading="lazy" title="La Liga"></iframe></div>

  <div><h4 style="color:#fef08a;margin:16px 0 8px 0;">🇩🇪 Bundesliga</h4>
  <iframe src="https://footballdata.io/widget/livescore?league=22&theme=dark&accent=2d2a2a&refresh=60" style="width:100%;max-width:100%;height:470px;border:0;border-radius:12px" loading="lazy" title="Bundesliga"></iframe></div>

  <div><h4 style="color:#fef08a;margin:16px 0 8px 0;">🇮🇹 Serie A</h4>
  <iframe src="https://footballdata.io/widget/livescore?league=14&theme=dark&accent=2d2a2a&refresh=60" style="width:100%;max-width:100%;height:470px;border:0;border-radius:12px" loading="lazy" title="Serie A"></iframe></div>

  <div><h4 style="color:#fef08a;margin:16px 0 8px 0;">🇫🇷 Ligue 1 Pháp</h4>
  <iframe src="https://footballdata.io/widget/livescore?league=164&theme=dark&accent=2d2a2a&refresh=60" style="width:100%;max-width:100%;height:470px;border:0;border-radius:12px" loading="lazy" title="Ligue 1"></iframe></div>

  <div><h4 style="color:#fef08a;margin:16px 0 8px 0;">🇪🇸 Siêu Cúp Tây Ban Nha</h4>
  <iframe src="https://footballdata.io/widget/livescore?league=13&theme=dark&accent=2d2a2a&refresh=60" style="width:100%;max-width:100%;height:470px;border:0;border-radius:12px" loading="lazy" title="Siêu Cúp Tây Ban Nha"></iframe></div>

  <div><h4 style="color:#fef08a;margin:16px 0 8px 0;">🏆 Euro League</h4>
  <iframe src="https://footballdata.io/widget/livescore?league=46&theme=dark&accent=2d2a2a&refresh=60" style="width:100%;max-width:100%;height:470px;border:0;border-radius:12px" loading="lazy" title="Euro League"></iframe></div>

  <div><h4 style="color:#fef08a;margin:16px 0 8px 0;">🏴 Cúp FA Anh</h4>
  <iframe src="https://footballdata.io/widget/livescore?league=20&theme=dark&accent=2d2a2a&refresh=60" style="width:100%;max-width:100%;height:470px;border:0;border-radius:12px" loading="lazy" title="Cúp FA Anh"></iframe></div>

  <div><h4 style="color:#fef08a;margin:16px 0 8px 0;">🏴 Cúp Liên Đoàn Anh</h4>
  <iframe src="https://footballdata.io/widget/livescore?league=21&theme=dark&accent=2d2a2a&refresh=60" style="width:100%;max-width:100%;height:470px;border:0;border-radius:12px" loading="lazy" title="Cúp Liên Đoàn Anh"></iframe></div>

  <div><h4 style="color:#fef08a;margin:16px 0 8px 0;">🌍 Giải Vô Địch Quốc Tế</h4>
  <iframe src="https://footballdata.io/widget/livescore?league=50&theme=dark&accent=2d2a2a&refresh=60" style="width:100%;max-width:100%;height:470px;border:0;border-radius:12px" loading="lazy" title="Giải Vô Địch Quốc Tế"></iframe></div>

  <div><h4 style="color:#fef08a;margin:16px 0 8px 0;">🏆 Vô Địch AFC Châu Á</h4>
  <iframe src="https://footballdata.io/widget/livescore?league=153&theme=dark&accent=2d2a2a&refresh=60" style="width:100%;max-width:100%;height:470px;border:0;border-radius:12px" loading="lazy" title="Vô Địch AFC Châu Á"></iframe></div>
</div>`,

    anh: `<iframe src="https://footballdata.io/widget/livescore?league=15&theme=dark&accent=2d2a2a&refresh=60" style="width:100%;max-width:100%;height:470px;border:0;border-radius:12px" loading="lazy" title="Ngoại Hạng Anh"></iframe>`,

    c1: `<iframe src="https://footballdata.io/widget/livescore?league=45&theme=dark&accent=2d2a2a&refresh=60" style="width:100%;max-width:100%;height:470px;border:0;border-radius:12px" loading="lazy" title="Cúp C1"></iframe>`,

    laliga: `<iframe src="https://footballdata.io/widget/livescore?league=10&theme=dark&accent=2d2a2a&refresh=60" style="width:100%;max-width:100%;height:470px;border:0;border-radius:12px" loading="lazy" title="La Liga"></iframe>`,

    bundesliga: `<iframe src="https://footballdata.io/widget/livescore?league=22&theme=dark&accent=2d2a2a&refresh=60" style="width:100%;max-width:100%;height:470px;border:0;border-radius:12px" loading="lazy" title="Bundesliga"></iframe>`,

    italia: `<iframe src="https://footballdata.io/widget/livescore?league=14&theme=dark&accent=2d2a2a&refresh=60" style="width:100%;max-width:100%;height:470px;border:0;border-radius:12px" loading="lazy" title="Serie A"></iframe>`,

    vn: `<iframe src="https://footballdata.io/widget/livescore?league=164&theme=dark&accent=2d2a2a&refresh=60" style="width:100%;max-width:100%;height:470px;border:0;border-radius:12px" loading="lazy" title="Việt Nam"></iframe>`
};

// ==================================================
// ✅ KÊNH YOUTUBE TV360 → HIỂN KHI KHÔNG CÓ TRẬN
// ==================================================
const MA_PLAYLIST_TV360 = "UUZb5QZ9bF8WzC7xQ6dR9gA";

function layLinkTV360() {
    return `<div style="text-align:center;padding:30px 10px;color:#94a3b8;">
        <h3 style="color:#fef08a;margin-bottom:10px;">🎬 Chưa có trận đang diễn ra</h3>
        <p>Xem highlight mới nhất từ TV360 Thể Thao</p>
        <iframe class="video-iframe" src="https://www.youtube.com/embed/?listType=playlist&list=${MA_PLAYLIST_TV360}" allowfullscreen loading="lazy"></iframe>
    </div>`;
}

// === HIỂN TỶ SỐ HOẶC HIGHLIGHT ===
function hienTySoGiaiLon(){
    const tenGiai = {
        tatca: "Tất Cả Giải Lớn",
        anh: "Ngoại Hạng Anh",
        c1: "Cúp C1",
        laliga: "La Liga",
        bundesliga: "Bundesliga",
        italia: "Serie A",
        vn: "Việt Nam"
    };

    if(MA_NHUNG[GIAI_DANG_XEM]) {
        trangThai.textContent = "🔄 Đang tải dữ liệu " + tenGiai[GIAI_DANG_XEM] + "...";
        khungGiaiLon.innerHTML = MA_NHUNG[GIAI_DANG_XEM];
        setTimeout(()=>{
            trangThai.textContent = "✅ Đã cập nhật — " + tenGiai[GIAI_DANG_XEM];
        }, 8000);
    } else {
        khungGiaiLon.innerHTML = layLinkTV360();
        trangThai.textContent = "⚠️ Chưa có trận đang đá → Xem Highlight";
    }
}

// === CHUYỂN TAB ===
function chuyenTab(tenTab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('tab-' + tenTab).classList.add('active');
}

// === BẤM CHỌN GIẢI ===
const BTN_GIAI = document.querySelectorAll(".tab-giai-btn");
let GIAI_DANG_XEM = "tatca";
const khungGiaiLon = document.getElementById("khungGiaiLon");
const trangThai = document.getElementById("trangThai");

BTN_GIAI.forEach(btn => {
    btn.addEventListener("click", () => {
        BTN_GIAI.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        GIAI_DANG_XEM = btn.dataset.giai;
        hienTySoGiaiLon();
    });
});

// === MỞ TRANG → HIỂN TẤT CẢ GIẢI ===
hienTySoGiaiLon();
</script>
</body>
