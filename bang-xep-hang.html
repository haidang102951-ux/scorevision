        .hang-1 {

<h2>📊 Bảng Xếp Hạng Giải Đấu</h2>

<div class="loc-giai">
    <button class="loc-btn active" data-giai="TatCa">Tất Cả</button>
    <button class="loc-btn" data-giai="Ngoại Hạng Anh">🏴 Ngoại Hạng Anh</button>
    <button class="loc-btn" data-giai="Bundesliga">🇩🇪 Bundesliga</button>
    <button class="loc-btn" data-giai="Ligue 1">🇫🇷 Ligue 1</button>
    <button class="loc-btn" data-giai="Serie A">🇮🇹 Serie A</button>
    <button class="loc-btn" data-giai="La Liga">🇪🇸 La Liga</button>
    <button class="loc-btn" data-giai="Cúp C1 Châu Âu">🏆 Cúp C1 Châu Âu</button>
</div>

<div id="bxh-list">
    <div class="loading">Đang tải bảng xếp hạng...</div>
</div>

<div class="ghi-chu">
    💡 <strong>Giải thích màu sắc:</strong>
    🟡 Đầu bảng |
    ⚪ Thứ 2 |
    🟠 Thứ 3
    — Sắp xếp theo: Điểm → Hiệu số → Số bàn thắng
</div>

<script>

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRjGewmdAmJVjyi-0vSc22hhFPacMgGc-WmVE8PEM3jHfA7IvED3XbBp68Bwp16n1Dc2FFP9ETKTaSH/pub?gid=0&single=true&output=csv";

let duLieuGoc = [];
let giaiDangChon = "TatCa";


/* =========================================
   ĐỌC CSV
========================================= */

function parseCSV(text) {

    const rows = [];
    let row = [];
    let cell = "";
    let inQuote = false;

    for (let i = 0; i < text.length; i++) {

        const ch = text[i];
        const next = text[i + 1] || "";

        if (ch === '"') {

            if (inQuote && next === '"') {
                cell += '"';
                i++;
            } else {
                inQuote = !inQuote;
            }

        } else if (ch === "," && !inQuote) {

            row.push(cell.trim());
            cell = "";

        } else if ((ch === "\n" || ch === "\r") && !inQuote) {

            if (cell !== "" || row.length > 0) {

                row.push(cell.trim());
                rows.push(row);

                row = [];
                cell = "";
            }

        } else {

            cell += ch;
        }
    }

    if (cell !== "" || row.length > 0) {
        row.push(cell.trim());
        rows.push(row);
    }

    return rows;
}


/* =========================================
   ĐỌC DỮ LIỆU GOOGLE SHEET
========================================= */

fetch(CSV_URL)

.then(response => {

    if (!response.ok) {
        throw new Error(
            "Không đọc được Google Sheet."
        );
    }

    return response.text();
})

.then(csv => {

    const rows = parseCSV(csv);

    if (rows.length < 2) {

        document.getElementById("bxh-list").innerHTML =
        `<div class="empty">
            ⚠️ Sheet chưa có dữ liệu Bảng Xếp Hạng!
        </div>`;

        return;
    }

    const header =
        rows[0].map(h =>
            h.trim().toLowerCase()
        );


    const idx_loai =
        header.indexOf("loai_muc");

    const idx_thutu =
        header.indexOf("thu_tu");

    const idx_giai =
        header.indexOf("giai_dau");

    const idx_doi =
        header.indexOf("doi_bong");

    const idx_sotran =
        header.indexOf("so_tran");

    const idx_thang =
        header.indexOf("thang");

    const idx_hoa =
        header.indexOf("hoa");

    const idx_thua =
        header.indexOf("thua");

    const idx_ban_thang =
        header.indexOf("ban_thang");

    const idx_ban_thua =
        header.indexOf("ban_thua");

    const idx_hieu_so =
        header.indexOf("hieu_so");

    const idx_diem =
        header.indexOf("diem_so");


    if (
        idx_loai === -1 ||
        idx_giai === -1 ||
        idx_doi === -1 ||
        idx_diem === -1
    ) {

        document.getElementById("bxh-list").innerHTML =
        `<div class="empty">
            ❌ Thiếu cột dữ liệu!<br><br>
            Cần có:<br>
            loai_muc, thu_tu, giai_dau, doi_bong,
            so_tran, thang, hoa, thua,
            ban_thang, ban_thua, hieu_so, diem_so
        </div>`;

        return;
    }


    /* =========================================
       ĐƯA DỮ LIỆU VÀO MẢNG
    ========================================= */

    for (let i = 1; i < rows.length; i++) {

        const r = rows[i];

        const loai =
            (r[idx_loai] || "").trim();

        if (loai !== "bang_xep_hang") {
            continue;
        }


        const thang =
            Number(r[idx_thang]) || 0;

        const hoa =
            Number(r[idx_hoa]) || 0;

        const thua =
            Number(r[idx_thua]) || 0;


        duLieuGoc.push({

            st:
                Number(r[idx_thutu]) || 999,

            giai:
                (r[idx_giai] || "Chưa phân loại").trim(),

            doi:
                (r[idx_doi] || "").trim(),

            sotran:
                Number(r[idx_sotran]) ||
                (thang + hoa + thua),

            thang:
                thang,

            hoa:
                hoa,

            thua:
                thua,

            ban_thang:
                Number(r[idx_ban_thang]) || 0,

            ban_thua:
                Number(r[idx_ban_thua]) || 0,

            hieu_so:
                Number(r[idx_hieu_so]) || 0,

            diem:
                Number(r[idx_diem]) || 0
        });
    }


    /* =========================================
       SẮP XẾP
    ========================================= */

    duLieuGoc.sort((a, b) => {

        if (b.diem !== a.diem) {
            return b.diem - a.diem;
        }

        if (b.hieu_so !== a.hieu_so) {
            return b.hieu_so - a.hieu_so;
        }

        return b.ban_thang - a.ban_thang;
    });


    hienThiDuLieu();

})

.catch(error => {

    document.getElementById("bxh-list").innerHTML =
    `<div class="empty">
        ❌ Lỗi: ${error.message}<br><br>
        👉 Kiểm tra Google Sheet đã được
        "Xuất bản trên web" hay chưa.
    </div>`;
});


/* =========================================
   HIỂN THỊ BẢNG
========================================= */

function hienThiDuLieu() {

    let dataLoc = duLieuGoc;


    if (giaiDangChon !== "TatCa") {

        dataLoc =
            duLieuGoc.filter(
                d => d.giai === giaiDangChon
            );
    }


    if (!dataLoc.length) {

        document.getElementById("bxh-list").innerHTML =
        `<div class="empty">
            📭 Chưa có dữ liệu cho giải này!
        </div>`;

        return;
    }


    const box =
        document.getElementById("bxh-list");


    let html = `

    <div class="bang-wrap">

        <table>

            <colgroup>
                <col style="width:45px">
                <col style="width:190px">
                <col style="width:65px">
                <col style="width:50px">
                <col style="width:50px">
                <col style="width:50px">
                <col style="width:90px">
                <col style="width:90px">
                <col style="width:80px">
                <col style="width:70px">
            </colgroup>

            <thead>

                <tr>
                    <th>#</th>
                    <th>Đội Bóng</th>
                    <th>Trận</th>
                    <th>T</th>
                    <th>H</th>
                    <th>B</th>
                    <th>Bàn Thắng</th>
                    <th>Bàn Thua</th>
                    <th>Hiệu Số</th>
                    <th>Điểm</th>
                </tr>

            </thead>

            <tbody>
    `;


    dataLoc.forEach((x, vitri) => {

        let lopHang = "";

        if (vitri === 0) {
            lopHang = "hang-1";
        }
        else if (vitri === 1) {
            lopHang = "hang-2";
        }
        else if (vitri === 2) {
            lopHang = "hang-3";
        }


        const hieuText =
            x.hieu_so > 0
            ? "+" + x.hieu_so
            : x.hieu_so;


        html += `

            <tr class="${lopHang}">

                <td class="vi-tri">
                    ${vitri + 1}
                </td>

                <td class="doi-ten">
                    ${x.doi}
                </td>

                <td>
                    ${x.sotran}
                </td>

                <td class="thang">
                    ${x.thang}
                </td>

                <td class="hoa">
                    ${x.hoa}
                </td>

                <td class="thua">
                    ${x.thua}
                </td>

                <td>
                    ${x.ban_thang}
                </td>

                <td>
                    ${x.ban_thua}
                </td>

                <td class="hieu-so">
                    ${hieuText}
                </td>

                <td class="tong-diem">
                    ${x.diem}
                </td>

            </tr>
        `;
    });


    html += `

            </tbody>

        </table>

    </div>
    `;


    box.innerHTML = html;
}


/* =========================================
   NÚT CHỌN GIẢI
========================================= */

document
.querySelectorAll(".loc-btn")
.forEach(btn => {

    btn.addEventListener("click", () => {

        document
        .querySelectorAll(".loc-btn")
        .forEach(b =>
            b.classList.remove("active")
        );


        btn.classList.add("active");


        giaiDangChon =
            btn.dataset.giai;


        hienThiDuLieu();
    });
});

</script>
