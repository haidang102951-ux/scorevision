<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Xếp Hạng | Score Vision</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
        body{background:#05050a;color:#f8fafc;line-height:1.6;padding:16px;max-width:768px;margin:0 auto;}
        .menu{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px;}
        .menu-btn{background:#0f172a;color:#cbd5e1;padding:10px 14px;border-radius:10px;text-align:center;text-decoration:none;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:5px;border:1px solid #1e293b;transition:all .2s;}
        .menu-btn:hover{transform:translateY(-2px);border-color:#334155;}
        .menu-btn.active{background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);color:white;border-color:#f59e0b;box-shadow:0 4px 12px rgba(245,158,11,.25);}
        .page-title{font-size:24px;font-weight:800;margin:20px 0 30px;text-align:center;color:#fef08a;}
        .group-title{font-size:16px;font-weight:700;color:#fef08a;margin:20px 0 10px;}
        table{width:100%;border-collapse:collapse;background:#0f172a;border-radius:12px;overflow:hidden;margin-bottom:16px;}
        th{background:#1e293b;padding:10px 6px;text-align:center;font-size:13px;color:#fef08a;}
        td{padding:10px 6px;text-align:center;font-size:14px;border-bottom:1px solid #1e293b;}
        .hang{font-weight:700;color:#fef08a;}
        .team{text-align:left;padding-left:12px;}
        .empty{text-align:center;color:#64748b;padding:50px 20px;}
    </style>
</head>
<body>
<nav class="menu">
    <a href="index.html" class="menu-btn">🏠 Trang chủ</a>
    <a href="lich-dau.html" class="menu-btn">📅 Lịch đấu</a>
    <a href="du-doan.html" class="menu-btn">🔮 Dự đoán</a>
    <a href="bang-xep-hang.html" class="menu-btn active">📊 Bảng xếp hạng</a>
    <a href="thong-ke.html" class="menu-btn">📈 Thống kê</a>
    <a href="tin-nong.html" class="menu-btn">📰 Tin Nóng</a>
</nav>

<h1 class="page-title">📊 Bảng Xếp Hạng</h1>
<div id="bxh-list"><div class="empty">Đang tải dữ liệu...</div></div>

<script>
const GID_BANG_XEP_HANG = "2032200987";
const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQwrXKqXdfjGK7EQCkNwjuv-FbFJxHhQyCg1NxBl2kkMnGuPCYL1vnG6QFBujGwNCVlx5v1keQuviBV/pub?output=csv&gid="+GID_BANG_XEP_HANG;

function parseCSV(text){
    const rows=[], lines=text.split("\n");
    for(let l of lines){
        if(!l.trim())continue;
        let p=[],c="",q=0;
        for(let ch of l){
            if(ch=='"')q=!q;
            else if(ch==','&&!q){p.push(c.trim());c="";}
            else c+=ch;
        }
        p.push(c.trim());rows.push(p);
    }
    return rows;
}

fetch(URL).then(r=>r.text()).then(csv=>{
    const rows=parseCSV(csv), data=[];
    for(let i=1;i<rows.length;i++){
        const [loai,thutu,giaidau,doi_bong,so_tran,diem,thang,hoa,thua]=rows[i];
        if(loai!=="bang_xep_hang")continue;
        data.push({st:Number(thutu)||999,giaidau,doi_bong,so_tran,diem,thang,hoa,thua});
    }
    data.sort((a,b)=>a.st-b.st);
    const box=document.getElementById("bxh-list");
    if(!data.length){box.innerHTML=`<div class="empty">Chưa có dữ liệu<br>Điền vào Sheet "Bảng Xếp Hạng" → tự hiện!</div>`;return;}
    const nhom={};
    data.forEach(x=>{
        if(!nhom[x.giaidau])nhom[x.giaidau]=[];
        nhom[x.giaidau].push(x);
    });
    box.innerHTML="";
    for(let ten_giai in nhom){
        box.innerHTML+=`<h2 class="group-title">🏆 ${ten_giai}</h2><table><tr><th>#</th><th>Đội</th><th>Trận</th><th>Điểm</th><th>T</th><th>H</th><th>B</th></tr>`;
        nhom[ten_giai].forEach(x=>{
            box.innerHTML+=`<tr><td class="hang">${x.st}</td><td class="team">${x.doi_bong}</td><td>${x.so_tran}</td><td><b>${x.diem}</b></td><td>${x.thang}</td><td>${x.hoa}</td><td>${x.thua}</td></tr>`;
        });
        box.innerHTML+=`</table>`;
    }
}).catch(()=>{document.getElementById("bxh-list").innerHTML=`<div class="empty" style="color:#f87171;">⚠️ Kiểm tra Sheet!</div>`;});
</script>
</body>
</html>
