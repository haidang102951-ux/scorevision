<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Xếp Hạng | Score Vision</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
        body{background:#020617;color:#f8fafc;line-height:1.6;padding:16px;max-width:860px;margin:0 auto;}

        /* === MENU CHÍNH === */
        .menu{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;position:sticky;top:0;background:#020617f0;padding:10px 0;z-index:99;backdrop-filter:blur(8px);}
        .menu-btn{background:linear-gradient(135deg,#1e293b,#0f172a);color:#e2e8f0;padding:10px 12px;border-radius:12px;text-align:center;text-decoration:none;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:4px;border:1px solid #334155;transition:all .25s;}
        .menu-btn:hover{transform:translateY(-2px);border-color:#fef08a;box-shadow:0 4px 12px rgba(254,240,138,.15);}
        .menu-btn.active{background:linear-gradient(135deg,#f97316,#ea580c);color:white;border-color:#f97316;box-shadow:0 4px 14px rgba(249,115,22,.35);}

        h2{text-align:center;font-size:22px;color:#fef08a;margin-bottom:24px;}

        /* === NÚT CHỌN GIẢI === */
        .chon-giai{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:24px;}
        .nut-giai{padding:10px 18px;border-radius:12px;background:#1e293b;color:#cbd5e1;border:2px solid #334155;font-size:14px;font-weight:600;cursor:pointer;transition:all .3s;}
        .nut-giai:hover{border-color:#fef08a;transform:translateY(-2px);}
        .nut-giai.dang-chon{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;border-color:#3b82f6;box-shadow:0 4px 12px rgba(59,130,246,.3);}

        /* === BẢNG XẾP HẠNG === */
        .bxh-table{width:100%;border-collapse:separate;border-spacing:0;border-radius:12px;overflow:hidden;background:linear-gradient(145deg,#1e293b,#0f172a);border:1px solid #1e293b;}
        .bxh-table th{background:#1e3a5f;color:#fef08a;padding:12px 6px;text-align:center;font-size:13px;font-weight:700;}
        .bxh-table th:nth-child(2){text-align:left;padding-left:16px;}
        .bxh-table td{padding:12px 6px;text-align:center;border-top:1px solid #334155;font-size:14px;}
        .bxh-table td:nth-child(2){text-align:left;padding-left:16px;font-weight:600;color:#e2e8f0;}
        .bxh-table tr:nth-child(1){background:rgba(59,130,246,.15);}
        .bxh-table tr:nth-child(1) td:first-child{color:#fef08a;font-weight:900;}
        .bxh-table tr:hover{background:rgba(59,130,246,.08);}

        .empty{text-align:center;color:#64748b;padding:60px 20px;}
        .loading{text-align:center;color:#fef08a;padding:40px;animation:nhapnhay 1.5s infinite;}
        @keyframes nhapnhay{0%,100%{opacity:1;}50%{opacity:.4;}}
    </style>
</head>
<body>

<nav class="menu">
    <a href="index.html" class="menu-btn">🏠 Trang chủ</a>
    <a href="lich-dau.html" class="menu-btn">📅 Lịch đấu</a>
    <a href="du-doan.html" class="menu-btn">🔮 Phân Tích</a>
    <a href="bang-xep-hang.html" class="menu-btn active">📊 Bảng xếp hạng</a>
    <a href="thong-ke.html" class="menu-btn">📈 Thống kê</a>
    <a href="tin-nong.html" class="menu-btn">📰 Tin Nóng</a>
    <a href="ket-qua.html" class="menu-btn">⚽ Kết Quả</a>
</nav>

<h2>📊 Bảng Xếp Hạng Theo Giải Đấu</h2>

<!-- NÚT CHỌN GIẢI → TỰ ĐỘNG LẤY TỪ SHEET -->
<div class="chon-giai" id="nutGiai"></div>

<!-- BẢNG DỮ LIỆU -->
<div id="bxh-container"><div class="loading">Đang tải bảng xếp hạng...</div></div>

<script>
// === LINK SHEET MỚI ĐÃ THAY ===
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRjGewmdAmJVjyi-0vSc22hhFPacMgGc-WmVE8PEM3jHfA7IvED3XbBp68Bwp16n1Dc2FFP9ETKTaSH/pub?gid=0&single=true&output=csv";

let tatCaDuLieu = {};
let giaiDauChon = "";

function parseCSV(text){
    const rows=[], lines=text.split("\n");
    for(let l of lines){
        if(!l.trim())continue;
        let p=[],c="",q=0;
        for(let ch of l){
            if(ch=='"')q=!q;
            else if(ch==','&&!q){p.push(c.trim());c="";}
            else c+=ch;
        }
        p.push(c.trim());rows.push(p);
    }
    return rows;
}

function hienThiBang(giai){
    const container = document.getElementById("bxh-container");
    if(!tatCaDuLieu[giai]){
        container.innerHTML = `<div class="empty">Chưa có dữ liệu cho giải này</div>`;
        return;
    }
    const ds = tatCaDuLieu[giai];
    container.innerHTML = `
    <table class="bxh-table">
        <thead>
            <tr>
                <th>#</th>
                <th>Đội Bóng</th>
                <th>Tr</th>
                <th>T</th>
                <th>H</th>
                <th>Th</th>
                <th>Bt</th>
                <th>Bb</th>
                <th>HS</th>
                <th>Điểm</th>
            </tr>
        </thead>
        <tbody>
            ${ds.map(x=>`
            <tr>
                <td>${x.st}</td>
                <td>${x.doi}</td>
                <td>${x.sotran}</td>
                <td>${x.thang}</td>
                <td>${x.hoa}</td>
                <td>${x.thua}</td>
                <td>${x.banthang}</td>
                <td>${x.banthua}</td>
                <td>${x.hieuso}</td>
                <td><strong style="color:#fef08a">${x.diem}</strong></td>
            </tr>`).join("")}
        </tbody>
    </table>`;
    document.querySelectorAll(".nut-giai").forEach(nut=>{
        nut.classList.toggle("dang-chon", nut.dataset.giai === giai);
    });
    giaiDauChon = giai;
}

fetch(CSV_URL).then(r=>r.text()).then(csv=>{
    const rows=parseCSV(csv);
    console.log("✅ Đọc được:", rows);

    if(rows.length<2){
        document.getElementById("bxh-container").innerHTML=`<div class="empty">Chưa có dữ liệu → Điền vào Sheet Bảng Xếp Hạng!</div>`;
        return;
    }

    const header=rows[0].map(h=>h.trim().toLowerCase());
    const idx_loai = header.indexOf("loai_muc");
    const idx_thutu = header.indexOf("thu_tu");
    const idx_giai = header.indexOf("giai_dau");
    const idx_doi = header.indexOf("doi_bong");
    const idx_sotran = header.indexOf("so_tran");
    const idx_thang = header.indexOf("thang");
    const idx_hoa = header.indexOf("hoa");
    const idx_thua = header.indexOf("thua");
    const idx_banthang = header.indexOf("ban_thang");
    const idx_banthua = header.indexOf("ban_thua");
    const idx_hieuso = header.indexOf("hieu_so");
    const idx_diem = header.indexOf("diem_so");

    if([idx_loai,idx_thutu,idx_giai,idx_doi,idx_sotran,idx_diem].includes(-1)){
        document.getElementById("bxh-container").innerHTML=`<div class="empty">❌ Kiểm tra tên cột Hàng 1: loai_muc, thu_tu, giai_dau, doi_bong, so_tran, thang, hoa, thua, ban_thang, ban_thua, hieu_so, diem_so</div>`;
        return;
    }

    for(let i=1;i<rows.length;i++){
        const r=rows[i];
        if(r[idx_loai]!=="bang_xep_hang")continue;
        const doi = (r[idx_doi]||"").trim();
        const giai = (r[idx_giai]||"Khác").trim();
        if(!doi) continue;

        const dong = {
            st:Number(r[idx_thutu])||999,
            doi:doi,
            sotran:(r[idx_sotran]||"0").trim(),
            thang:(r[idx_thang]||"0").trim(),
            hoa:(r[idx_hoa]||"0").trim(),
            thua:(r[idx_thua]||"0").trim(),
            banthang:(r[idx_banthang]||"0").trim(),
            banthua:(r[idx_banthua]||"0").trim(),
            hieuso:(r[idx_hieuso]||"0").trim(),
            diem:(r[idx_diem]||"0").trim()
        };
        if(!tatCaDuLieu[giai]) tatCaDuLieu[giai]=[];
        tatCaDuLieu[giai].push(dong);
    }

    Object.keys(tatCaDuLieu).forEach(g=>tatCaDuLieu[g].sort((a,b)=>a.st-b.st));

    const dsGiai = Object.keys(tatCaDuLieu).sort();
    const nutContainer = document.getElementById("nutGiai");
    nutContainer.innerHTML = dsGiai.map(giai=>`
        <button class="nut-giai" data-giai="${giai}">${giai}</button>
    `).join("");

    document.querySelectorAll(".nut-giai").forEach(nut=>{
        nut.addEventListener("click", ()=>hienThiBang(nut.dataset.giai));
    });

    if(dsGiai.length > 0){
        hienThiBang(dsGiai[0]);
    }else{
        document.getElementById("bxh-container").innerHTML=`<div class="empty">Điền dữ liệu vào Sheet → nút giải sẽ hiện tự động!</div>`;
    }

}).catch(err=>{
    document.getElementById("bxh-container").innerHTML=`<div class="empty">Lỗi tải dữ liệu: ${err.message}</div>`;
});
</script>
</body>
</html>
