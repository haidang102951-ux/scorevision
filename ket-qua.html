<h1 class="page-title">⚽ Tất Cả Kết Quả Trận Đấu</h1>

<!-- === THẺ NÚT LỌC THEO GIẢI ĐẤU === -->
<div class="filter-tabs">
    <button class="filter-tab active" data-giai="all">Tất cả giải đấu</button>
    <button class="filter-tab" data-giai="ngoại hạng anh">🏴 Ngoại Hạng Anh</button>
    <button class="filter-tab" data-giai="la liga">🇪🇸 La Liga</button>
    <button class="filter-tab" data-giai="bundesliga">🇩🇪 Bundesliga</button>
    <button class="filter-tab" data-giai="serie a">🇮🇹 Serie A</button>
    <button class="filter-tab" data-giai="ligue 1">🇫🇷 Ligue 1</button>
    <button class="filter-tab" data-giai="champions">🏆 Champions League</button>
</div>

<div id="ketqua-list"><div class="loading">Đang tải kết quả trận đấu...</div></div>
</div>
<script>
const BASE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRjGewmdAmJVjyi-0vSc22hhFPacMgGc-WmVE8PEM3jHfA7IvED3XbBp68Bwp16n1Dc2FFP9ETKTaSH/pub?output=csv&gid=1819801064";

let tatCaDuLieu = []; // Lưu toàn bộ dữ liệu để lọc
let giaiDangChon = "all";

// Lấy tên giải chuẩn để lọc
function layTenGiaiChuan(tenGiai){
    const g = (tenGiai || "").trim().toLowerCase();
    if(g.includes("ngoại hạng anh") || g.includes("premier")) return "ngoại hạng anh";
    if(g.includes("la liga")) return "la liga";
    if(g.includes("bundesliga")) return "bundesliga";
    if(g.includes("serie a")) return "serie a";
    if(g.includes("ligue 1")) return "ligue 1";
    if(g.includes("champions")) return "champions";
    return g;
}

// Lọc và hiển thị dữ liệu theo giải được chọn
function locVaHienThi(){
    const box = document.getElementById("ketqua-list");
    box.innerHTML = "";
    const duLieuLoc = giaiDangChon === "all" 
        ? tatCaDuLieu 
        : tatCaDuLieu.filter(x => x.giaiChuan === giaiDangChon);
    
    if(!duLieuLoc.length){
        box.innerHTML = `<div class="empty">Chưa có kết quả của giải này!</div>`;
        return;
    }
    
    duLieuLoc.forEach(x => {
        box.innerHTML += `<div class="card-ketqua">
            <div class="ketqua-header">
                <span class="ketqua-league">${x.giai}</span>
                <span class="ketqua-date">${x.ngay}</span>
            </div>
            <div class="ketqua-match">
                <span class="ketqua-team ketqua-team-home">${x.nha}</span>
                <div class="ketqua-score">
                    <span class="ketqua-score-num">${x.tyso}</span>
                </div>
                <span class="ketqua-team ketqua-team-away">${x.khach}</span>
            </div>
            <div class="ketqua-status">
                <span class="status-finished">✓ Kết thúc</span>
            </div>
        </div>`;
    });
}

// Xử lý khi bấm nút lọc
document.querySelectorAll(".filter-tab").forEach(tab => {
    tab.addEventListener("click", () => {
        // Bỏ active hết
        document.querySelectorAll(".filter-tab").forEach(t => t.classList.remove("active"));
        // Thêm active nút vừa bấm
        tab.classList.add("active");
        // Lưu giải đang chọn
        giaiDangChon = tab.dataset.giai;
        // Lọc và hiển thị
        locVaHienThi();
    });
});

function parseCSV(text){
    const rows = [];
    let row = [], cell = "", inQuote = false;
    for(let i = 0; i < text.length; i++){
        let ch = text[i], next = text[i+1] || "";
        if(ch === '"'){
            if(inQuote && next === '"'){ cell += '"'; i++; }
            else inQuote = !inQuote;
        }
        else if(ch === ',' && !inQuote){
            row.push(cell.trim()); cell = "";
        }
        else if((ch === '\n' || ch === '\r') && !inQuote){
            if(cell || row.length > 0){ row.push(cell.trim()); rows.push(row); row = []; cell = ""; }
        }
        else cell += ch;
    }
    if(cell || row.length > 0){ row.push(cell.trim()); rows.push(row); }
    return rows;
}

fetch(BASE_URL)
.then(r => { if(!r.ok) throw new Error("Lỗi kết nối Sheet"); return r.text(); })
.then(csv => {
    const rows = parseCSV(csv);
    if(rows.length < 2){
        document.getElementById("ketqua-list").innerHTML = `<div class="empty">Chưa có dữ liệu!</div>`;
        return;
    }
    const header = rows[0].map(h => h.trim().toLowerCase());
    const idx_loai = header.indexOf("loai_muc");
    const idx_thutu = header.indexOf("thu_tu");
    const idx_tran = header.indexOf("tran_dau");
    const idx_tyso = header.indexOf("ty_so");
    const idx_giai = header.indexOf("giai_dau");
    const idx_ngay = header.indexOf("ngay_gio");
    
    if([idx_loai, idx_tran, idx_tyso].includes(-1)){
        document.getElementById("ketqua-list").innerHTML = `<div class="empty">❌ Sai cột Sheet!</div>`;
        return;
    }
    
    tatCaDuLieu = [];
    for(let i = 1; i < rows.length; i++){
        const r = rows[i];
        if((r[idx_loai] || "").trim() !== "ket_qua") continue;
        const tran = (r[idx_tran] || "").trim();
        if(tran.includes("Không có trận")) continue;
        let doiNha = "", doiKhach = "";
        if(tran.includes(" vs ")){
            const phan = tran.split(" vs ");
            doiNha = phan[0].trim();
            doiKhach = phan[1].trim();
        } else {
            continue;
        }
        const tenGiai = (r[idx_giai] || "Bóng Đá").trim();
        tatCaDuLieu.push({
            st: Number(r[idx_thutu]) || 999,
            nha: doiNha,
            khach: doiKhach,
            tyso: (r[idx_tyso] || "-").trim(),
            ngay: (r[idx_ngay] || "").trim(),
            giai: tenGiai,
            giaiChuan: layTenGiaiChuan(tenGiai)
        });
    }
    tatCaDuLieu.sort((a, b) => a.st - b.st);
    
    // Hiển thị lần đầu tiên
    locVaHienThi();
})
.catch(err => {
    document.getElementById("ketqua-list").innerHTML = `<div class="empty">❌ Lỗi: ${err.message}</div>`;
});
</script>
