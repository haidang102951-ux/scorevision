<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin Nóng & Cập Nhật | Score Vision</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
        body{background:#020617;color:#f8fafc;line-height:1.7;padding:16px;max-width:780px;margin:0 auto;}
        
        /* === MENU === */
        .menu{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;position:sticky;top:0;background:#020617f0;padding:10px 0;z-index:99;backdrop-filter:blur(8px);}
        .menu-btn{background:linear-gradient(135deg,#1e293b,#0f172a);color:#e2e8f0;padding:10px 12px;border-radius:12px;text-align:center;text-decoration:none;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:4px;border:1px solid #334155;transition:all .25s;}
        .menu-btn:hover{transform:translateY(-3px);border-color:#fef08a;box-shadow:0 6px 16px rgba(254,240,138,.15);}
        .menu-btn.active{background:linear-gradient(135deg,#f97316,#ef4444);color:white;border-color:#f97316;box-shadow:0 4px 14px rgba(249,115,22,.35);}
        
        /* === THẺ BÀI VIẾT === */
        .tin-item{background:linear-gradient(145deg,#1e293b,#0f172a);border-radius:18px;padding:0;margin-bottom:16px;border:2px solid #1e293b;cursor:pointer;transition:all .3s;overflow:hidden;}
        .tin-item:hover{border-color:#f97316;transform:translateY(-2px);box-shadow:0 8px 20px rgba(249,115,22,.15);}
        .tin-hot{border-color:#ef4444;box-shadow:0 0 15px rgba(239,68,68,.15);}
        
        /* === ✅ ĐÃ SỬA: ẢNH HIỂN THỊ ĐẦY ĐỦ, KHÔNG BỊ CẮT === */
        .tin-anh-bia{
            width:100%;
            height:180px;
            object-fit:contain; /* ✅ QUAN TRỌNG: HIỂN THỊ ĐẦY ĐỦ ẢNH */
            background:#1a1c35; /* Nền tối cho ảnh không khớp tỉ lệ */
            border-bottom:1px solid rgba(254,240,138,.15);
        }
        
        .tin-noi-dung{padding:18px;}
        .tin-tieu-de{font-size:17px;font-weight:800;color:#fef08a;margin-bottom:6px;line-height:1.4;}
        .tin-ngay{display:inline-block;background:rgba(239,68,68,.15);color:#fca5a5;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;margin-bottom:12px;}
        .tin-tom-tat{font-size:14px;color:#e2e8f0;line-height:1.6;margin-bottom:8px;}
        .tin-hint{font-size:13px;color:#94a3b8;font-style:italic;}
        
        /* === NỘI DUNG CHI TIẾT — ẨN / HIỆN === */
        .tin-full{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed #334155;}
        .tin-full.show{display:block;}
        .tin-noi-dung-chi-tiet{font-size:15px;color:#f1f5f9;line-height:1.8;white-space:pre-wrap;}
        .tin-noi-dung-chi-tiet p{margin-bottom:10px;}
        
        .empty{text-align:center;color:#64748b;padding:60px 20px;}
        .loading{text-align:center;color:#fef08a;padding:40px;animation:nhapnhay 1.5s infinite;}
        @keyframes nhapnhay{0%,100%{opacity:1;}50%{opacity:.4;}}
    </style>
</head>
<body>
<nav class="menu">
    <a href="index.html" class="menu-btn">🏠 Trang chủ</a>
    <a href="lich-dau.html" class="menu-btn">📅 Lịch đấu</a>
    <a href="du-doan.html" class="menu-btn">🔮 Phân Tích & Dự Đoán</a>
    <a href="bang-xep-hang.html" class="menu-btn">📊 Bảng xếp hạng</a>
    <a href="thong-ke.html" class="menu-btn">📈 Thống kê</a>
    <a href="tin-nong.html" class="menu-btn active">📰 Tin Nóng</a>
</nav>
<h2 style="font-size:22px;color:#fef08a;margin-bottom:20px;">📰 Tin Nóng & Cập Nhật Mới</h2>
<div id="list-tin"><div class="loading">Đang tải tin tức...</div></div>
<script>
const GID = "1328630352";
const BASE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQwrXKqXdfjGK7EQCkNwjuv-FbFJxHhQyCg1NxBl2kkMnGuPCYL1vnG6QFBujGwNCVlx5v1keQuviBV/pub?output=csv&gid=";
// === Ảnh mặc định nếu không có link ảnh bìa ===
const ANH_MAC_DINH = "https://images.unsplash.com/photo-1574629810360-7ef513a43c33?w=800&h=400&fit=crop&q=80";
// === ĐỌC CSV ĐÚNG NỘI DUNG CÓ XUỐNG DÒNG ===
function parseCSV(text){
    const rows = [];
    let row = [], cell = "", inQuote = false;
    
    for(let i = 0; i < text.length; i++){
        let ch = text[i];
        let next = text[i+1] || "";
        
        if(ch === '"'){
            if(inQuote && next === '"'){ cell += '"'; i++; }
            else inQuote = !inQuote;
        }
        else if(ch === ',' && !inQuote){
            row.push(cell.trim());
            cell = "";
        }
        else if((ch === '\n' || ch === '\r') && !inQuote){
            if(cell || row.length > 0){
                row.push(cell.trim());
                rows.push(row);
                row = [];
                cell = "";
            }
        }
        else cell += ch;
    }
    if(cell || row.length > 0){ row.push(cell.trim()); rows.push(row); }
    return rows;
}
// === CHUYỂN XUỐNG DÒNG THÀNH HTML ===
function xuLyNoiDung(text){
    if(!text || text.trim() === "") return "Chưa có nội dung chi tiết";
    return text.replace(/\r\n/g, "<br>").replace(/\r/g, "<br>").replace(/\n/g, "<br>");
}
fetch(BASE_URL+GID)
.then(r=>{if(!r.ok)throw new Error("Lỗi kết nối Sheet");return r.text();})
.then(csv=>{
    const rows=parseCSV(csv);
    if(rows.length<2){
        document.getElementById("list-tin").innerHTML=`<div class="empty">Chưa có dữ liệu trên Sheet!</div>`;
        return;
    }
    
    // === TÌM ĐÚNG TÊN CỘT NHƯ TRÊN SHEET CỦA BẠN ===
    const header=rows[0].map(h=>h.trim().toLowerCase());
    const idx_loai = header.indexOf("loai_muc");
    const idx_thutu = header.indexOf("thu_tu");
    const idx_tieu_de = header.indexOf("tieu_de");
    const idx_ngay = header.indexOf("ngay_cap_nhat");
    const idx_tomtat = header.indexOf("tom_tat");
    const idx_noidung = header.indexOf("noi_dung_day_du");
    const idx_anhbia = header.indexOf("anh_bia");
    
    if([idx_loai,idx_thutu,idx_tieu_de,idx_ngay,idx_tomtat,idx_noidung].includes(-1)){
        document.getElementById("list-tin").innerHTML=`<div class="empty">❌ Kiểm tra Hàng 1 Sheet: Phải có đúng cột: loai_muc, thu_tu, tieu_de, ngay_cap_nhat, tom_tat, noi_dung_day_du, anh_bia</div>`;
        return;
    }
    
    // === ĐỌC DỮ LIỆU ===
    const data=[];
    for(let i=1;i<rows.length;i++){
        const r=rows[i];
        if(!r || r.length < 6) continue;
        if((r[idx_loai]||"").trim() !== "tin_nong") continue;
        
        data.push({
            st: Number(r[idx_thutu])||999,
            tieu_de: (r[idx_tieu_de]||"").trim(),
            ngay: (r[idx_ngay]||"").trim(),
            tom_tat: (r[idx_tomtat]||"").trim(),
            noi_dung: (r[idx_noidung]||"").trim(),
            anh_bia: idx_anhbia >= 0 ? (r[idx_anhbia]||"").trim() : ANH_MAC_DINH
        });
    }
    
    // === SẮP XẾP THEO SỐ THỨ TỤ — NHỎ NHẤT LÊN TRÊN ===
    data.sort((a,b)=>a.st - b.st);
    const box=document.getElementById("list-tin");
    if(!data.length){
        box.innerHTML=`<div class="empty">Chưa có tin tức nào → điền loai_muc = tin_nong vào Sheet!</div>`;
        return;
    }
    
    // === HIỂN THỊ DANH SÁCH CÓ ẢNH BÌA ===
    box.innerHTML="";
    data.forEach((x,idx)=>{
        const id_tin = "tin-"+idx;
        const link_anh = x.anh_bia && x.anh_bia.startsWith("http") ? x.anh_bia : ANH_MAC_DINH;
        
        box.innerHTML+=`
        <div class="tin-item ${idx===0?'tin-hot':''}" id="${id_tin}">
            <img src="${link_anh}" alt="${x.tieu_de}" class="tin-anh-bia" loading="lazy">
            <div class="tin-noi-dung">
                <h3 class="tin-tieu-de">${idx===0?'🔥 ':''}${x.tieu_de}</h3>
                <span class="tin-ngay">📅 ${x.ngay}</span>
                <p class="tin-tom-tat">${x.tom_tat}</p>
                <p class="tin-hint">👉 Bấm vào xem chi tiết ↓</p>
                <div class="tin-full" id="${id_tin}-full">
                    <div class="tin-noi-dung-chi-tiet">${xuLyNoiDung(x.noi_dung)}</div>
                </div>
            </div>
        </div>`;
    });
    
    // === BẤM XEM / THU GỌN ===
    data.forEach((_,idx)=>{
        const id_tin = "tin-"+idx;
        const item = document.getElementById(id_tin);
        const full = document.getElementById(id_tin+"-full");
        if(item && full){
            item.addEventListener("click",()=>{
                full.classList.toggle("show");
                const hint = item.querySelector(".tin-hint");
                if(full.classList.contains("show")) hint.textContent = "↑ Thu gọn lại ↑";
                else hint.textContent = "👉 Bấm vào xem chi tiết ↓";
            });
        }
    });
})
.catch(err=>{
    document.getElementById("list-tin").innerHTML=`<div class="empty">❌ Lỗi: ${err.message}</div>`;
});
</script>
</body>
</html>
