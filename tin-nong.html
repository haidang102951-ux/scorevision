<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
        body{background:#05050a;color:#f8fafc;line-height:1.8;padding:16px;max-width:768px;margin:0 auto;}
        .menu{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px;}
        .menu-btn{background:#0f172a;color:#cbd5e1;padding:10px 14px;border-radius:10px;text-align:center;text-decoration:none;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:5px;border:1px solid #1e293b;transition:all .2s;}
        .menu-btn:hover{transform:translateY(-2px);border-color:#334155;}
        .menu-btn.active{background:linear-gradient(135deg,#ef4444 0%,#dc2626 100%);color:white;border-color:#ef4444;box-shadow:0 4px 12px rgba(239,68,68,.25);}
        .page-title{font-size:24px;font-weight:800;margin:20px 0 30px;text-align:center;color:#fca5a5;}
        .card{background:linear-gradient(145deg,#1e293b,#0f172a);border-radius:20px;padding:20px;margin-bottom:16px;border:2px solid #334155;}
        .card:hover{border-color:#ef4444;}
        .card-title{font-size:17px;font-weight:700;color:#fef08a;margin-bottom:8px;}
        .card-date{font-size:13px;color:#fca5a5;margin-bottom:12px;}
        .card-content{color:#e2e8f0;line-height:1.7;}
        .empty{text-align:center;color:#64748b;padding:50px 20px;}
    </style>
</head>
<body>

<h1 class="page-title">📰 Tin Nóng & Phân Tích</h1>
<div id="tin-list"><div class="empty">Đang tải dữ liệu...</div></div>

<script>
const GID_TIN_NONG = "1328630352";
const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQwrXKqXdfjGK7EQCkNwjuv-FbFJxHhQyCg1NxBl2kkMnGuPCYL1vnG6QFBujGwNCVlx5v1keQuviBV/pub?output=csv&gid="+GID_TIN_NONG;

function parseCSV(text){
    const rows=[], lines=text.split("\n");
    for(let l of lines){
        if(!l.trim())continue;
        let p=[],c="",q=0;
        for(let ch of l){
            if(ch=='"')q=!q;
            else if(ch==','&&!q){p.push(c.trim());c="";}
            else c+=ch;
        }
        p.push(c.trim());rows.push(p);
    }
    return rows;
}

fetch(URL).then(r=>r.text()).then(csv=>{
    const rows=parseCSV(csv), data=[];
    for(let i=1;i<rows.length;i++){
        const [loai,thutu,tieu_de,ngay,noi_dung_tom_tat]=rows[i];
        if(loai!=="tin_nong")continue;
        data.push({st:Number(thutu)||999,tieu_de,ngay,noi_dung_tom_tat});
    }
    data.sort((a,b)=>a.st-b.st);
    const box=document.getElementById("tin-list");
    if(!data.length){box.innerHTML=`<div class="empty">Chưa có tin tức<br>Điền vào Sheet "Tin Nóng" → tự hiện!</div>`;return;}
    box.innerHTML="";
    data.forEach(x=>{
        box.innerHTML+=`<div class="card">
            <h3 class="card-title">${x.tieu_de}</h3>
            <div class="card-date">📅 ${x.ngay}</div>
            <div class="card-content">${x.noi_dung_tom_tat}</div>
        </div>`;
    });
}).catch(()=>{document.getElementById("tin-list").innerHTML=`<div class="empty" style="color:#f87171;">⚠️ Kiểm tra Sheet!</div>`;});
</script>
</body>
</html>
