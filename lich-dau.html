<script>
/* Menu ngang: mobile dùng native scroll, PC hỗ trợ kéo bằng chuột */
(function(){
    const menu=document.querySelector('.menu');
    if(!menu)return;

    let dragging=false,moved=false,startX=0,startScroll=0;

    menu.addEventListener('mousedown',function(e){
        if(e.button!==0)return;
        dragging=true;
        moved=false;
        startX=e.clientX;
        startScroll=menu.scrollLeft;
        menu.classList.add('dragging');
    });

    window.addEventListener('mousemove',function(e){
        if(!dragging)return;
        const dx=e.clientX-startX;
        if(Math.abs(dx)>5){
            moved=true;
            e.preventDefault();
        }
        menu.scrollLeft=startScroll-dx;
    },{passive:false});

    function stop(){
        if(!dragging)return;
        dragging=false;
        menu.classList.remove('dragging');
    }

    window.addEventListener('mouseup',stop);
    window.addEventListener('blur',stop);

    menu.addEventListener('wheel',function(e){
        if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;
        const max=menu.scrollWidth-menu.clientWidth;
        if(max<=0)return;
        const next=menu.scrollLeft+e.deltaY;
        if(next>0&&next<max){
            e.preventDefault();
            menu.scrollLeft=next;
        }
    },{passive:false});

    menu.addEventListener('click',function(e){
        if(moved){
            e.preventDefault();
            e.stopPropagation();
            moved=false;
        }
    },true);
})();
</script>

<script>
// ✅ LINK ĐÚNG NHẤT — TỪ XUẤT BẢN TRÊN WEB CỦA BẠN
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRjGewmdAmJVjyi-0vSc22hhFPacMgGc-WmVE8PEM3jHfA7IvED3XbBp68Bwp16n1Dc2FFP9ETKTaSH/pub?gid=655851279&single=true&output=csv";

let duLieuGoc = [];
let giaiDangChon = "TatCa";

function parseCSV(text){
    const rows=[], lines=text.split("\n");
    for(let l of lines){
        if(!l.trim())continue;
        let p=[],c="",q=0;
        for(let ch of l){
            if(ch==='"')q=!q;
            else if(ch==','&&!q){p.push(c.trim());c="";}
            else c+=ch;
        }
        p.push(c.trim());rows.push(p);
    }
    return rows;
}

fetch(CSV_URL)
.then(r=>{
    if(!r.ok) throw new Error("Không đọc được sheet! Kiểm tra Xuất bản trên web");
    return r.text();
})
.then(csv=>{
    const rows=parseCSV(csv);
    if(rows.length<2){
        document.getElementById("list-lich").innerHTML=`<div class="empty">Chưa có dữ liệu!</div>`;
        return;
    }
    const header=rows[0].map(h=>h.trim().toLowerCase());
    const idx_loai = header.indexOf("loai_muc");
    const idx_thutu = header.indexOf("thu_tu");
    const idx_nha = header.indexOf("doi_nha");
    const idx_khach = header.indexOf("doi_khach");
    const idx_ngaygio = header.indexOf("ngay_gio");
    const idx_giai = header.indexOf("giai_dau");
    const idx_trangthai = header.indexOf("trang_thai");
    const idx_sandau = header.indexOf("san_dau");

    if([idx_loai,idx_thutu,idx_nha,idx_khach,idx_ngaygio,idx_giai,idx_trangthai].includes(-1)){
        document.getElementById("list-lich").innerHTML=`<div class="empty">❌ Thiếu cột! Kiểm tra tiêu đề cột trong sheet</div>`;
        return;
    }

    for(let i=1;i<rows.length;i++){
        const r=rows[i];
        if(r[idx_loai]!=="lich_dau")continue;
        const nha = (r[idx_nha]||"").trim();
        const khach = (r[idx_khach]||"").trim();
        if(!nha || !khach) continue;
        duLieuGoc.push({
            st:Number(r[idx_thutu])||999,
            nha:nha,
            khach:khach,
            ngaygio:(r[idx_ngaygio]||"").trim(),
            giai:(r[idx_giai]||"").trim(),
            trangthai:(r[idx_trangthai]||"").trim(),
            sandau:idx_sandau>=0 ? (r[idx_sandau]||"").trim() : ""
        });
    }

    duLieuGoc.sort((a,b)=>a.st-b.st);
    hienThiDuLieu();
})
.catch(err=>{
    document.getElementById("list-lich").innerHTML=`<div class="empty">❌ Lỗi: ${err.message}<br>Kiểm tra: Tệp → Xuất bản trên web → Nhấn Xuất bản</div>`;
});

function hienThiDuLieu(){
    let dataLoc = duLieuGoc;
    if(giaiDangChon !== "TatCa"){
        dataLoc = duLieuGoc.filter(d => d.giai.includes(giaiDangChon) || giaiDangChon.includes(d.giai));
    }
    const box=document.getElementById("list-lich");
    if(!dataLoc.length){
        box.innerHTML=`<div class="empty">📭 Chưa có lịch đấu cho giải này!</div>`;
        return;
    }
    box.innerHTML="";
    dataLoc.forEach(x=>{
        box.innerHTML+=`<div class="lich-item">
            <div class="lich-giai">🏆 ${x.giai}</div>
            <div class="lich-doi">
                <span class="lich-doi-nha">${x.nha}</span>
                <span class="lich-vs">VS</span>
                <span class="lich-doi-khach">${x.khach}</span>
            </div>
            ${x.sandau ? `<div class="lich-san">🏟️ ${x.sandau}</div>` : ""}
            <div class="lich-duong-ke"></div>
            <div class="lich-thoi-gian">
                <span class="lich-ngay">📅 ${x.ngaygio}</span>
                <span class="lich-trang-thai">${x.trangthai}</span>
            </div>
        </div>`;
    });
}

document.querySelectorAll(".loc-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
        document.querySelectorAll(".loc-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        giaiDangChon = btn.dataset.giai;
        hienThiDuLieu();
    });
});
</script>
