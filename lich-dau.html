<script>
/* Menu ngang: mobile dùng native scroll, PC hỗ trợ kéo bằng chuột */
(function(){
    const menu=document.querySelector('.menu');
    if(!menu)return;

    let dragging=false,moved=false,startX=0,startScroll=0;

    menu.addEventListener('mousedown',function(e){
        if(e.button!==0)return;
        dragging=true;
        moved=false;
        startX=e.clientX;
        startScroll=menu.scrollLeft;
        menu.classList.add('dragging');
    });

    window.addEventListener('mousemove',function(e){
        if(!dragging)return;
        const dx=e.clientX-startX;
        if(Math.abs(dx)>5){
            moved=true;
            e.preventDefault();
        }
        menu.scrollLeft=startScroll-dx;
    },{passive:false});

    function stop(){
        if(!dragging)return;
        dragging=false;
        menu.classList.remove('dragging');
    }

    window.addEventListener('mouseup',stop);
    window.addEventListener('blur',stop);

    menu.addEventListener('wheel',function(e){
        if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;
        const max=menu.scrollWidth-menu.clientWidth;
        if(max<=0)return;
        const next=menu.scrollLeft+e.deltaY;
        if(next>0&&next<max){
            e.preventDefault();
            menu.scrollLeft=next;
        }
    },{passive:false});

    menu.addEventListener('click',function(e){
        if(moved){
            e.preventDefault();
            e.stopPropagation();
            moved=false;
        }
    },true);
})();
</script>

<script>
// ✅ LINK ĐÚNG NHẤT — TỪ XUẤT BẢN TRÊN WEB CỦA BẠN
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRjGewmdAmJVjyi-0vSc22hhFPacMgGc-WmVE8PEM3jHfA7IvED3XbBp68Bwp16n1Dc2FFP9ETKTaSH/pub?gid=655851279&single=true&output=csv";

let duLieuGoc = [];
let giaiDangChon = "TatCa";

function parseCSV(text){
    const rows=[], lines=text.split("\n");
    for(let l of lines){
        if(!l.trim())continue;
        let p=[],c="",q=0;
        for(let ch of l){
            if(ch==='"')q=!q;
            else if(ch==','&&!q){p.push(c.trim());c="";}
            else c+=ch;
        }
        p.push(c.trim());rows.push(p);
    }
    return rows;
}

fetch(CSV_URL)
.then(r=>{
    if(!r.ok) throw new Error("Không đọc được sheet! Kiểm tra Xuất bản trên web");
    return r.text();
})
.then(csv=>{
    const rows=parseCSV(csv);
    if(rows.length<2){
        document.getElementById("list-lich").innerHTML=`<div class="empty">Chưa có dữ liệu!</div>`;
        return;
    }
    const header=rows[0].map(h=>h.trim().toLowerCase());
    const idx_loai = header.indexOf("loai_muc");
    const idx_thutu = header.indexOf("thu_tu");
    const idx_nha = header.indexOf("doi_nha");
    const idx_khach = header.indexOf("doi_khach");
    const idx_ngaygio = header.indexOf("ngay_gio");
    const idx_giai = header.indexOf("giai_dau");
    const idx_trangthai = header.indexOf("trang_thai");
    const idx_sandau = header.indexOf("san_dau");

    if([idx_loai,idx_thutu,idx_nha,idx_khach,idx_ngaygio,idx_giai,idx_trangthai].includes(-1)){
        document.getElementById("list-lich").innerHTML=`<div class="empty">❌ Thiếu cột! Kiểm tra tiêu đề cột trong sheet</div>`;
        return;
    }

    for(let i=1;i<rows.length;i++){
        const r=rows[i];
        if(r[idx_loai]!=="lich_dau")continue;
        const nha = (r[idx_nha]||"").trim();
        const khach = (r[idx_khach]||"").trim();
        if(!nha || !khach) continue;
        duLieuGoc.push({
            st:Number(r[idx_thutu])||999,
            nha:nha,
            khach:khach,
            ngaygio:(r[idx_ngaygio]||"").trim(),
            giai:(r[idx_giai]||"").trim(),
            trangthai:(r[idx_trangthai]||"").trim(),
            sandau:idx_sandau>=0 ? (r[idx_sandau]||"").trim() : ""
        });
    }

    duLieuGoc.sort((a,b)=>a.st-b.st);
    hienThiDuLieu();
    /* Tải kho logo sau khi lịch đã hiện, không chặn nội dung chính. */
    setTimeout(loadLogoDatabase, 0);
})
.catch(err=>{
    document.getElementById("list-lich").innerHTML=`<div class="empty">❌ Lỗi: ${err.message}<br>Kiểm tra: Tệp → Xuất bản trên web → Nhấn Xuất bản</div>`;
});

const LOGO_DATA_URL = "https://cdn.jsdelivr.net/gh/hixcoder/football-teams-flags@main/football_teams.json";
const LOGO_CACHE_KEY = "scorevision_team_logos_v1";
let logoIndex = null;
let logoLoadPromise = null;

function normalizeTeamName(name){
    return String(name||"")
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/\b(fc|cf|afc|sc|ac|club|football|futebol|de|the)\b/g, " ")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function getLogoCache(){
    try{return JSON.parse(localStorage.getItem(LOGO_CACHE_KEY)||"{}");}
    catch(e){return {};}
}
function saveLogoCache(cache){
    try{localStorage.setItem(LOGO_CACHE_KEY,JSON.stringify(cache));}catch(e){}
}

function buildLogoIndex(list){
    const map=new Map();
    (Array.isArray(list)?list:[]).forEach(t=>{
        const key=normalizeTeamName(t.name);
        if(key && t.logoUrl && !map.has(key)) map.set(key,t.logoUrl);
    });
    return map;
}

function logoScore(query,candidate){
    if(query===candidate)return 1000;
    const a=new Set(query.split(" ").filter(Boolean));
    const b=new Set(candidate.split(" ").filter(Boolean));
    if(!a.size||!b.size)return 0;
    let common=0; a.forEach(x=>{if(b.has(x))common++;});
    const coverage=common/Math.max(a.size,b.size);
    const shortPenalty=(candidate.length>query.length*2.5)?0.08:0;
    return coverage*100-shortPenalty*100;
}

function findLogo(teamName){
    const key=normalizeTeamName(teamName);
    if(!key)return null;

    const cache=getLogoCache();
    if(cache[key])return cache[key];
    if(!logoIndex)return null;

    if(logoIndex.has(key)){
        const url=logoIndex.get(key);
        cache[key]=url; saveLogoCache(cache); return url;
    }

    let bestUrl=null,bestScore=0;
    for(const [candidate,url] of logoIndex){
        const score=logoScore(key,candidate);
        if(score>bestScore){bestScore=score;bestUrl=url;}
    }
    /* Chỉ nhận fuzzy match khi đủ chắc chắn, tránh gán nhầm logo. */
    if(bestUrl && bestScore>=72){
        cache[key]=bestUrl; saveLogoCache(cache); return bestUrl;
    }
    return null;
}

function loadLogoDatabase(){
    if(logoLoadPromise)return logoLoadPromise;
    logoLoadPromise=fetch(LOGO_DATA_URL,{cache:"force-cache"})
        .then(r=>{if(!r.ok)throw new Error("Logo database unavailable");return r.json();})
        .then(list=>{logoIndex=buildLogoIndex(list); hienThiDuLieu(); return logoIndex;})
        .catch(()=>{logoIndex=new Map(); return logoIndex;});
    return logoLoadPromise;
}

function safeText(v){
    return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function teamHtml(name,side){
    const safe=safeText(name);
    const url=findLogo(name);
    const logo=url
        ? `<img class="team-logo" src="${url}" alt="Logo ${safe}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=\"team-logo-fallback\" aria-label=\"Không có logo\">⚽</div>'">`
        : `<div class="team-logo-fallback" aria-label="Logo mặc định">⚽</div>`;
    return `<div class="team ${side==='away'?'team-away':''}">${logo}<div class="team-name">${safe}</div></div>`;
}

function hienThiDuLieu(){
    let dataLoc=duLieuGoc;
    if(giaiDangChon!=="TatCa") dataLoc=duLieuGoc.filter(d=>d.giai.includes(giaiDangChon)||giaiDangChon.includes(d.giai));
    const box=document.getElementById("list-lich");
    if(!dataLoc.length){box.innerHTML=`<div class="empty">📭 Chưa có lịch đấu cho giải này!</div>`;return;}
    box.innerHTML=dataLoc.map(x=>{
        const safeLeague=safeText(x.giai||"Lịch đấu");
        const safeDate=safeText(x.ngaygio||"");
        const safeStatus=safeText(x.trangthai||"Sắp diễn ra");
        const safeVenue=safeText(x.sandau||"");
        return `<article class="lich-item">
            <div class="lich-giai"><span class="lich-giai-ten">🏆 ${safeLeague}</span><span class="lich-status-top">SẮP ĐẤU</span></div>
            <div class="lich-doi">
                ${teamHtml(x.nha,'home')}
                <div class="lich-vs-wrap"><span class="lich-vs">VS</span><div class="lich-time">${safeDate.split(/\s+/)[0]||"--:--"}</div><div class="lich-date">${safeDate.split(/\s+/).slice(1).join(" ")||""}</div></div>
                ${teamHtml(x.khach,'away')}
            </div>
            ${safeVenue ? `<div class="lich-san">🏟️ ${safeVenue}</div>` : ""}
            <div class="lich-duong-ke"></div>
            <div class="lich-thoi-gian"><span class="lich-ngay">📅 ${safeDate}</span><span class="lich-trang-thai">${safeStatus}</span></div>
        </article>`;
    }).join("");
}

document.querySelectorAll(".loc-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
        document.querySelectorAll(".loc-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        giaiDangChon = btn.dataset.giai;
        hienThiDuLieu();
    });
});
