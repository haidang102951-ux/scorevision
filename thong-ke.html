<h1 class="page-title">📈 Thống Kê Tổng Hợp</h1>
<div id="tk-list"><div class="empty">Đang tải từ Google Sheets...</div></div>
<a href="index.html" class="back-btn">← Quay lại Trang chủ</a>

<script>
const URL_SHEETS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQwrXKqXdfjGK7EQCkNwjuv-FbFJxHhQyCg1NxBl2kkMnGuPCYL1vnG6QFBujGwNCVlx5v1keQuviBV/pub?gid=0&single=true&output=csv";
fetch(URL_SHEETS).then(r=>r.text()).then(csv=>{
    const rows=[], lines=csv.split("\n");
    for(let l of lines){
        if(!l.trim())continue;
        let p=[],c="",q=0;
        for(let ch of l){
            if(ch=='"')q=!q;
            else if(ch==','&&!q){p.push(c.trim());c="";}
            else c+=ch;
        }
        p.push(c.trim());rows.push(p);
    }
    const box=document.getElementById("tk-list");
    box.innerHTML="";
    let found=false;
    for(let i=1;i<rows.length;i++){
        const [loai,thutu,ten,giaTri]=rows[i];
        if(loai!=="thong_ke")continue;
        found=true;
        box.innerHTML+=`<div class="stat-card"><div class="stat-name">${ten}</div><div class="stat-value">${giaTri||"—"}</div></div>`;
    }
    if(!found){box.innerHTML=`<div class="empty">Chưa có dữ liệu thống kê<br><small>Điền vào Sheets → tự hiện!</small></div>`;return;}
}).catch(()=>{document.getElementById("tk-list").innerHTML=`<div class="empty" style="color:#f87171;">⚠️ Kiểm tra Sheets!</div>`;});
</script>
</body>
