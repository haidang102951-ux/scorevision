<h2>📈 Thống Kê & Phân Tích Trận Đấu</h2>
<p class="mota">6 Giải Châu Âu + Cúp C1 + ASEAN + ĐT Việt Nam • Cập nhật tự động</p>
<p class="capnhat">🔄 Tự động lấy dữ liệu MỚI nhất từ Sheet mỗi khi mở trang</p>

<div id="list-tran"><div class="loading">Đang tải dữ liệu trận đấu...</div></div>

<script>
// === LINK SHEET + THÊM DẤU THỜI GIAN → LUÔN LẤY MỚI NHẤT ===
const GOC_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRjGewmdAmJVjyi-0vSc22hhFPacMgGc-WmVE8PEM3jHfA7IvED3XbBp68Bwp16n1Dc2FFP9ETKTaSH/pub?gid=575449196&single=true&output=csv";
// Thêm thời gian vào URL → Trình duyệt KHÔNG lưu đệm → LUÔN LẤY MỚI TỪ SHEET
const CSV_URL = GOC_URL + "&t=" + Date.now();

// === HÀM ĐỌC CSV ĐÚNG ĐỊNH DẠNG ===
function parseCSV(text){
    const rows = [], lines = text.split("\n");
    for(let l of lines){
        if(!l.trim()) continue;
        let p = [], c = "", q = 0;
        for(let ch of l){
            if(ch === '"') q = !q;
            else if(ch === ',' && !q){ p.push(c.trim()); c = ""; }
            else c += ch;
        }
        p.push(c.trim());
        rows.push(p);
    }
    return rows;
}

// === TÁCH NGÀY GIỎ TỪ CHUỖI ĐỂ SẮP XẾP ===
function tachNgayGio(chiTieu){
    if(!chiTieu) return 0;
    const phanTach = chiTieu.split(" | ");
    if(phanTach.length < 2) return Date.now();
    const ngayGioStr = phanTach[1];
    const match = ngayGioStr.match(/(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s+(\d{1,2}):(\d{2})/);
    if(match){
        const [,ngay,thang,nam,gio,phut] = match;
        return new Date(`${nam}-${thang}-${ngay}T${gio}:${phut}:00+07:00`).getTime();
    }
    return Date.now();
}

fetch(CSV_URL)
.then(r => {
    if(!r.ok) throw new Error("Không kết nối được Sheet");
    return r.text();
})
.then(csv => {
    const rows = parseCSV(csv);
    console.log("✅ Đọc được " + rows.length + " hàng từ Sheet (dữ liệu mới nhất)");

    if(rows.length < 2){
        document.getElementById("list-tran").innerHTML = `<div class="empty">Chưa có dữ liệu trận đấu trên Sheet!</div>`;
        return;
    }

    // === TÌM ĐÚNG CỘT THEO SHEET ===
    const header = rows[0].map(h => h.trim().toLowerCase());
    const idx_loai   = header.indexOf("loai_muc");     // Cột A trên Sheet thực tế
    const idx_thutu  = header.indexOf("thu_tu");       // Cột B
    const idx_chitieu= header.indexOf("danh_muc");     // Cột C
    const idx_donvi  = header.indexOf("doi");          // Cột D
    const idx_solieu = header.indexOf("chi_so");       // Cột E
    const idx_ghichu = header.indexOf("ghi_chu");      // Cột F

    // === KIỂM TRA CỘT ĐỦ CHƯA ===
    const thieuCot = [];
    if(idx_loai   === -1) thieuCot.push("loai_muc (cột A)");
    if(idx_thutu  === -1) thieuCot.push("thu_tu (cột B)");
    if(idx_chitieu=== -1) thieuCot.push("danh_muc (cột C)");
    if(idx_donvi  === -1) thieuCot.push("doi (cột D)");
    if(idx_solieu === -1) thieuCot.push("chi_so (cột E)");
    if(idx_ghichu === -1) thieuCot.push("ghi_chu (cột F)");

    if(thieuCot.length > 0){
        document.getElementById("list-tran").innerHTML = `<div class="empty">❌ Thiếu cột: ${thieuCot.join(", ")}<br>Kiểm tra hàng tiêu đề trên Sheet!</div>`;
        console.log("Tên cột thực tế trên Sheet:", header);
        return;
    }

    // === LẤY DỮ LIỆU TỪNG TRẬN ===
    const danhSachTran = [];
    for(let i = 1; i < rows.length; i++){
        const r = rows[i];
        const loai = (r[idx_loai] || "").trim();
        const thuTu = Number(r[idx_thutu]) || i;
        const chiTieu = (r[idx_chitieu] || "").trim();
        const donVi = (r[idx_donvi] || "").trim();
        const soLieu = (r[idx_solieu] || "").trim();
        const ghiChu = (r[idx_ghichu] || "").trim();
        const ngayGioSoSanh = tachNgayGio(chiTieu);

        // Bỏ hàng trống
        if(!donVi && !chiTieu) continue;

        danhSachTran.push({thuTu, loai, chiTieu, donVi, soLieu, ghiChu, ngayGioSoSanh});
    }

    // ✅ === SẮP XẾP THÔNG MINH ===
    // 1. TRẬN SẮP ĐẤU lên TRƯỚC → sắp xếp theo NGÀY GẦN NHẤT trước
    // 2. TRẬN ĐÃ ĐẤU ở DƯỚI → sắp xếp theo NGÀY MỚI NHẤT trước
    danhSachTran.sort((a, b) => {
        const aSap = a.loai.includes("Sắp đấu") || a.loai.includes("Chờ");
        const bSap = b.loai.includes("Sắp đấu") || b.loai.includes("Chờ");

        if(aSap && !bSap) return -1;    // a Sắp đấu → lên trước
        if(!aSap && bSap) return 1;     // b Sắp đấu → a xuống sau

        // Cùng loại → Sắp theo NGÀY: Sắp đấu thì GẦN NHẤT trước / Đã đấu thì MỚI NHẤT trước
        return aSap ? a.ngayGioSoSanh - b.ngayGioSoSanh : b.ngayGioSoSanh - a.ngayGioSoSanh;
    });

    console.log("✅ " + danhSachTran.length + " trận hợp lệ (Đã sắp xếp: Sắp đấu trước → Đã đấu sau)");

    if(!danhSachTran.length){
        document.getElementById("list-tran").innerHTML = `<div class="empty">Không có trận đấu nào hợp lệ!</div>`;
        return;
    }

    // === HIỂN THỊ ĐẦY ĐỦ TỪNG TRẬN ===
    const box = document.getElementById("list-tran");
    box.innerHTML = "";

    danhSachTran.forEach(t => {
        // Tách "Giải đấu" và "Ngày giờ" từ cột Chỉ tiêu/Danh mục
        const phanTach = t.chiTieu.split(" | ");
        const tenGiai = phanTach[0] || "Bóng Đá";
        const ngayGio = phanTach[1] || "";

        // Màu loại trận
        const laSap = t.loai.includes("Sắp đấu") || t.loai.includes("Chờ");
        const classLoai = laSap ? "sap" : "dau";
        const textLoai = laSap ? "⏰ Sắp đấu" : "✅ Đã đấu";

        // Tách tỷ số nổi bật
        let tySoLon = t.soLieu;
        const matchTySo = t.soLieu.match(/(\d+)\s*[-–:]\s*(\d+)/);
        if(matchTySo){
            tySoLon = `<strong>${matchTySo[1]} - ${matchTySo[2]}</strong>`;
        }

        box.innerHTML += `
        <div class="tran-card">
            <span class="tran-loai ${classLoai}">${textLoai}</span>
            <div class="tran-giai">🏆 ${tenGiai}</div>
            <div class="tran-doi">⚽ ${t.donVi}</div>
            <div class="tran-ketqua">
                <div class="tran-tyso">${tySoLon}</div>
                <div class="tran-ngay">📅 ${ngayGio}</div>
            </div>
            <div class="tran-phantich">💡 ${t.ghiChu || "Chưa có phân tích."}</div>
        </div>`;
    });

}).catch(err => {
    console.error("Lỗi:", err);
    document.getElementById("list-tran").innerHTML = `<div class="empty">❌ Lỗi: ${err.message}</div>`;
});
</script>
