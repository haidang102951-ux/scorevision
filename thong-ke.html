<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống Kê | Score Vision</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
        body{background:#05050a;color:#f8fafc;line-height:1.6;padding:16px;max-width:768px;margin:0 auto;}
        .menu{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px;}
        .menu-btn{background:#0f172a;color:#cbd5e1;padding:10px 14px;border-radius:10px;text-align:center;text-decoration:none;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:5px;border:1px solid #1e293b;transition:all .2s;}
        .menu-btn:hover{transform:translateY(-2px);border-color:#334155;}
        .menu-btn.active{background:linear-gradient(135deg,#3b82f6 0%,#2563eb 100%);color:white;border-color:#3b82f6;box-shadow:0 4px 12px rgba(59,130,246,.25);}
        .page-title{font-size:24px;font-weight:800;margin:20px 0 30px;text-align:center;color:#93c5fd;}
        .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
        .card{background:linear-gradient(145deg,#1e293b,#0f172a);border-radius:14px;padding:20px;border:2px solid #334155;text-align:center;}
        .card:hover{border-color:#3b82f6;}
        .card-val{font-size:32px;font-weight:800;color:#fef08a;margin-bottom:8px;}
        .card-name{font-size:14px;color:#93c5fd;}
        .empty{text-align:center;color:#64748b;padding:50px 20px;}
    </style>
</head>
<body>
<nav class="menu">
    <a href="index.html" class="menu-btn">🏠 Trang chủ</a>
    <a href="lich-dau.html" class="menu-btn">📅 Lịch đấu</a>

    <a href="tin-nong.html" class="menu-btn">📰 Tin Nóng</a>
</nav>

<h1 class="page-title">📈 Thống Kê Dữ Liệu</h1>
<div id="tk-list" class="grid-2"><div class="empty">Đang tải dữ liệu...</div></div>

<script>
const GID_THONG_KE = "1399594488";
const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQwrXKqXdfjGK7EQCkNwjuv-FbFJxHhQyCg1NxBl2kkMnGuPCYL1vnG6QFBujGwNCVlx5v1keQuviBV/pub?output=csv&gid="+GID_THONG_KE;

function parseCSV(text){
    const rows=[], lines=text.split("\n");
    for(let l of lines){
        if(!l.trim())continue;
        let p=[],c="",q=0;
        for(let ch of l){
            if(ch=='"')q=!q;
            else if(ch==','&&!q){p.push(c.trim());c="";}
            else c+=ch;
        }
        p.push(c.trim());rows.push(p);
    }
    return rows;
}

fetch(URL).then(r=>r.text()).then(csv=>{
    const rows=parseCSV(csv), data=[];
    for(let i=1;i<rows.length;i++){
        const [loai,thutu,chi_so,gia_tri]=rows[i];
        if(loai!=="thong_ke")continue;
        data.push({st:Number(thutu)||999,chi_so,gia_tri});
    }
    data.sort((a,b)=>a.st-b.st);
    const box=document.getElementById("tk-list");
    if(!data.length){box.innerHTML=`<div class="empty">Chưa có số liệu<br>Điền vào Sheet "Thống Kê" → tự hiện!</div>`;return;}
    box.innerHTML="";
    data.forEach(x=>{
        box.innerHTML+=`<div class="card"><div class="card-val">${x.gia_tri}</div><div class="card-name">${x.chi_so}</div></div>`;
    });
}).catch(()=>{document.getElementById("tk-list").innerHTML=`<div class="empty" style="color:#f87171;">⚠️ Kiểm tra Sheet!</div>`;});
</script>
</body>
</html>
