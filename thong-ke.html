        .tk-card:hover{border-color:#fef08a;transform:translateY(-2px);box-shadow:0 8px 20px rgba(139,92,246,.18);}
        .tk-chiso{font-size:16px;color:#f1f5f9;font-weight:700;margin-bottom:10px;}
        .tk-doi{font-size:14px;color:#a5b4fc;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
        .tk-so-lieu{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
        .tk-con-so{font-size:30px;font-weight:900;color:#fef08a;line-height:1;}

<h2>📈 Thống Kê & Phân Tích Chuyên Gia</h2>
<p class="mota">Dữ liệu dựa trên chuỗi trận gần nhất • Nhận định tham khảo chuyên môn</p>
<div id="list-tk"><div class="loading">Đang tải dữ liệu chuyên gia...</div></div>
<script>
// === LINK MỚI ĐÃ THAY ===
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRjGewmdAmJVjyi-0vSc22hhFPacMgGc-WmVE8PEM3jHfA7IvED3XbBp68Bwp16n1Dc2FFP9ETKTaSH/pub?gid=575449196&single=true&output=csv";

function parseCSV(text){
    const rows=[], lines=text.split("\n");
    for(let l of lines){
        if(!l.trim())continue;
        let p=[],c="",q=0;
        for(let ch of l){
            if(ch=='"')q=!q;
            else if(ch==','&&!q){p.push(c.trim());c="";}
            else c+=ch;
        }
        p.push(c.trim());rows.push(p);
    }
    return rows;
}
fetch(CSV_URL).then(r=>r.text()).then(csv=>{
    const rows=parseCSV(csv);
    console.log("✅ Đọc được:", rows);
    if(rows.length<2){
        document.getElementById("list-tk").innerHTML=`<div class="empty">Chưa có dữ liệu → Kiểm tra Sheet Thống Kê!</div>`;
        return;
    }
    const header=rows[0].map(h=>h.trim().toLowerCase());
    const idx_loai = header.indexOf("loai_muc");
    const idx_thutu = header.indexOf("thu_tu");
    const idx_danhmuc = header.indexOf("danh_muc");
    const idx_doi = header.indexOf("doi");
    const idx_chiso = header.indexOf("chi_so");
    const idx_ghichu = header.indexOf("ghi_chu");
    if([idx_loai,idx_thutu,idx_danhmuc,idx_doi,idx_chiso,idx_ghichu].includes(-1)){
        document.getElementById("list-tk").innerHTML=`<div class="empty">❌ Kiểm tra lại tên cột Hàng 1: loai_muc, thu_tu, danh_muc, doi, chi_so, ghi_chu</div>`;
        return;
    }
    const data=[];
    for(let i=1;i<rows.length;i++){
        const r=rows[i];
        if(r[idx_loai]!=="thong_ke")continue;
        const chiso = (r[idx_chiso]||"").trim();
        if(!chiso) continue;
        data.push({
            st:Number(r[idx_thutu])||999,
            danhmuc:(r[idx_danhmuc]||"").trim(),
            doi:(r[idx_doi]||"").trim(),
            chiso:chiso,
            ghichu:(r[idx_ghichu]||"").trim()
        });
    }
    data.sort((a,b)=>a.st-b.st);
    console.log("✅ Dữ liệu sạch:", data);
    const box=document.getElementById("list-tk");
    if(!data.length){
        box.innerHTML=`<div class="empty">Chưa có số liệu thống kê hợp lệ → Kiểm tra dữ liệu trên Sheet!</div>`;
        return;
    }
    box.innerHTML="";
    data.forEach(x=>{
        box.innerHTML+=`
        <div class="tk-card">
            <div class="tk-chiso">📊 ${x.danhmuc}</div>
            <div class="tk-doi">🏟️ ${x.doi}</div>
            <div class="tk-so-lieu">
                <span class="tk-con-so">${x.chiso}</span>
            </div>
            <div class="tk-nhan-dinh">💡 ${x.ghichu}</div>
        </div>`;
    });
}).catch(err=>{
    document.getElementById("list-tk").innerHTML=`<div class="empty">Lỗi tải dữ liệu: ${err.message}</div>`;
});
</script>
